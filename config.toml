# Strategy settings.
# All clock times are US/Eastern (market time). Central time (CT) = ET - 1 hour.
# Private values (account number) never go in this file: the repo is public.
# Put them in config.local.toml (git-ignored), which overrides anything here.

[run]
# "observe": decide() still produces actions, but they are only journaled, never sent to the broker.
# "live":    actions are executed through the Robinhood connector (see docs/RUNBOOK.md).
mode = "live"

[account]
position_size_usd = 1500      # per trade; plan is to raise to 3000 after 1-2 clean weeks
min_shares = 1                # buy at least this many shares even if one share costs more (SNDK ~ $1,600)
max_positions = 2             # simultaneous open positions; set to 1 when position_size_usd = 3000
                              # (live orders are also capped by buying power)
max_daily_loss_usd = 100      # stop opening new positions once today's realized P&L <= -this

[symbols]
watchlist = ["AAOI", "SNDK", "ASTS"]

[entry]
# strict = MACD golden cross + RSI < rsi_max + Stochastic %K and %D < stoch_max, all on the same 1-minute bar
rule = "strict"
rsi_period = 14
rsi_max = 35
stoch_k = 14
stoch_smooth_k = 3
stoch_d = 3
stoch_max = 20
macd_fast = 12
macd_slow = 26
macd_signal = 9
macd_min_cross_margin = 0.0   # TODO: > 0 ignores crosses that barely clear the signal line
limit_price = "ask"           # "ask" (from quotes) or "last_close"
buy_order_ttl_minutes = 2     # cancel an unfilled buy order after this many minutes
forming_slack = 5             # decide.py reports "forming" (recheck next minute) when RSI and %K/%D are within this
                              # of the limits and MACD is closing in; 0 missed ASTS 2026-10-16 13:14 ET (D was 20.8
                              # one bar earlier). On past data: forming precedes 23/27 strict signals vs 19/27 at 0
signal_lookback_bars = 1      # decide.py also accepts a signal on the bar before the last one (Claude
                              # may be woken a minute late); signals already handled are skipped

[exit.take_profit]
enabled = true
pct = 0.0083                  # fixed take-profit, resting limit order on the broker

[exit.stop_loss]
enabled = true                # 2026-10-14: on, after AAOI fell 6% with no stop (-$90)
pct = 0.015                   # backtest (26 signals, intraday touch): +$149 vs +$152 without, worst trade -$23
mode = "oco"                  # "oco": one OCO order at the broker (take-profit limit + stop-market, filling one
                              #        cancels the other)
                              # "monitored": take-profit limit + market sell when a 1-minute bar closes at or below
                              #        the stop (fallback when OCO is unavailable)

[exit.dynamic]
# Shadow only: the journal records what these exits WOULD have done. Never executed.
enabled = false
giveback = 0.5                # sell when the gain falls to half of the best gain since arming
sell_on_kd_above = 80         # or when %K and %D are both above this
floor_at_take_profit = false  # "3 conditions" variant: also sell if price falls back below the take-profit level

[exit.end_of_day]
flatten_time = "15:50"        # ET (14:50 CT): cancel take-profit orders and sell anything still open

[schedule]
first_entry_time = "09:31"    # ET
last_entry_time = "15:45"     # ET; no new buys at or after this time
skip_earnings_day = true

[alerts]
price_alert_pct = -0.03       # phone alert this far below entry; 0 disables

[watcher]
# trader/live/watcher.py: Alpaca IEX bars as a cheap pre-filter. It only wakes Claude; the strict
# rule is re-checked on Robinhood bars before any order.
feed = "iex"                  # free plan: "iex" is the only real-time feed
poll_second = 4               # poll this many seconds after each minute closes
rsi_slack = 2                 # candidate if RSI < rsi_max + rsi_slack ...
stoch_slack = 2               # ... and %K, %D < stoch_max + stoch_slack ...
cross_window = 2              # ... with a MACD golden cross on one of the last N bars
near_cross_bars = 2           # ... or MACD closing on its signal line fast enough to cross within N bars (0 = off)
fill_gaps = true              # minutes without IEX trades become flat bars
history_days = 5              # calendar days of history fetched at start (indicator warm-up)
max_errors = 3                # consecutive failed polls before an ERROR event
fatal_after_minutes = 15      # give up (FATAL) after failing this long
no_data_check_time = "09:45"  # ET; no bars today by then = market closed, exit

[backtest]
half_spread = 0.0005          # paid on entry and on market exits
